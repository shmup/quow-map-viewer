<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quow map</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #title {
            position: fixed;
            z-index: 2;
            top: 0;
            right: 0;
            left: 0;
            height: 2rem;
            padding: 0.4rem 0.7rem;
            overflow: hidden;
            color: #eee;
            background: #202020e8;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #view {
            position: absolute;
            top: 2rem;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        #world {
            position: relative;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
        }

        #marker {
            position: absolute;
            z-index: 1;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #8b2fd6;
            transform: translate(-50%, -50%);
        }

        .crosshair {
            position: absolute;
            background: #ffe94d;
            mix-blend-mode: multiply;
        }

        #crosshair-h {
            left: 0;
            width: 100%;
            height: 5px;
            transform: translateY(-50%);
        }

        #crosshair-v {
            top: 0;
            width: 5px;
            height: 100%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="title">Waiting for room data</div>
    <div id="view">
        <div id="world">
            <img id="map" alt="">
            <div id="crosshair-h" class="crosshair" hidden></div>
            <div id="crosshair-v" class="crosshair" hidden></div>
            <div id="marker" hidden></div>
        </div>
    </div>
    <script>
        // fit-start
        function fitScale(viewWidth, viewHeight, imageWidth, imageHeight) {
            return Math.max(1, viewWidth / imageWidth, viewHeight / imageHeight);
        }

        function viewport(viewWidth, viewHeight, imageWidth, imageHeight, x, y, scale) {
            return {
                left: Math.min(
                    Math.max(0, imageWidth * scale - viewWidth),
                    Math.max(0, x * scale - viewWidth / 2),
                ),
                top: Math.min(
                    Math.max(0, imageHeight * scale - viewHeight),
                    Math.max(0, y * scale - viewHeight / 2),
                ),
            };
        }
        // fit-end

        const title = document.querySelector("#title");
        const view = document.querySelector("#view");
        const world = document.querySelector("#world");
        const image = document.querySelector("#map");
        const marker = document.querySelector("#marker");
        const crosshairH = document.querySelector("#crosshair-h");
        const crosshairV = document.querySelector("#crosshair-v");
        let current = null;
        let userScale = null;

        function draw(recentre) {
            if (!current) return;

            const scale = userScale ?? fitScale(
                view.clientWidth,
                view.clientHeight,
                current.w,
                current.h,
            );
            world.style.width = `${current.w * scale}px`;
            world.style.height = `${current.h * scale}px`;
            image.style.width = `${current.w * scale}px`;
            image.style.height = `${current.h * scale}px`;
            marker.style.left = `${current.x * scale}px`;
            marker.style.top = `${current.y * scale}px`;
            crosshairH.style.top = `${current.y * scale}px`;
            crosshairV.style.left = `${current.x * scale}px`;
            marker.hidden = false;
            crosshairH.hidden = false;
            crosshairV.hidden = false;

            if (recentre) {
                const offset = viewport(
                    view.clientWidth,
                    view.clientHeight,
                    current.w,
                    current.h,
                    current.x,
                    current.y,
                    scale,
                );
                view.scrollLeft = offset.left;
                view.scrollTop = offset.top;
            }
        }

        function update(data) {
            if (!data.known) {
                title.textContent = current
                    ? `${current.title} — unknown room (${data.room})`
                    : `Unknown room (${data.room})`;
                return;
            }

            const changedImage = !current || current.image !== data.image;
            current = data;
            title.textContent = `${data.title} — ${data.room}`;
            document.body.style.background = data.bg;
            if (changedImage) {
                image.onload = () => draw(true);
                image.src = `/maps/${encodeURIComponent(data.image)}`;
            } else {
                draw(true);
            }
        }

        view.addEventListener("wheel", event => {
            if (!current) return;
            event.preventDefault();
            const automatic = fitScale(
                view.clientWidth,
                view.clientHeight,
                current.w,
                current.h,
            );
            const scale = userScale ?? automatic;
            userScale = Math.min(8, Math.max(0.05, scale * (event.deltaY < 0 ? 1.15 : 1 / 1.15)));
            draw(true);
        }, {passive: false});

        window.addEventListener("resize", () => draw(true));
        const events = new EventSource("/events");
        events.onmessage = event => update(JSON.parse(event.data));
    </script>
</body>
</html>
