<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quow map</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #title {
            display: flex;
            position: fixed;
            z-index: 2;
            top: 0;
            right: 0;
            left: 0;
            gap: 0.7rem;
            align-items: center;
            height: 2rem;
            padding: 0.4rem 0.7rem;
            color: #eee;
            background: #202020e8;
        }

        #where {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #count {
            color: #ff8c1a;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        #search {
            width: 14rem;
            padding: 0.1rem 0.4rem;
            border: 1px solid #555;
            border-radius: 3px;
            background: #111;
            color: #eee;
            font: inherit;
            font-size: 0.85rem;
        }

        #search:focus {
            border-color: #ff8c1a;
            outline: none;
        }

        #view {
            position: absolute;
            top: 2rem;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            cursor: grab;
        }

        #view.panning {
            cursor: grabbing;
        }

        #world {
            position: relative;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;
        }

        #marker {
            position: absolute;
            z-index: 2;
            background: #8b2fd6;
            /* the ring's hole: a 6x6 pixel square minus its four corner pixels */
            clip-path: polygon(
                16.667% 0, 83.333% 0, 83.333% 16.667%, 100% 16.667%,
                100% 83.333%, 83.333% 83.333%, 83.333% 100%, 16.667% 100%,
                16.667% 83.333%, 0 83.333%, 0 16.667%, 16.667% 16.667%
            );
        }

        .hit {
            position: absolute;
            z-index: 1;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff8c1a;
            transform: translate(-50%, -50%);
        }

        .hit:hover {
            z-index: 3;
        }

        .hit > span {
            display: none;
            position: absolute;
            top: -0.4rem;
            left: 1.4rem;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            color: #eee;
            background: #202020f0;
            font-size: 0.8rem;
            white-space: nowrap;
            pointer-events: none;
        }

        .hit:hover > span {
            display: block;
        }

        .crosshair {
            position: absolute;
            background: #ffe94d;
            mix-blend-mode: multiply;
        }

        #crosshair-h {
            left: 0;
            width: 100%;
            height: 5px;
            transform: translateY(-50%);
        }

        #crosshair-v {
            top: 0;
            width: 5px;
            height: 100%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="title">
        <span id="where">Waiting for room data</span>
        <span id="count"></span>
        <input id="search" type="search" placeholder="find rooms — pshop, tshop, stable" autocomplete="off">
    </div>
    <div id="view">
        <div id="world">
            <img id="map" alt="">
            <div id="crosshair-h" class="crosshair" hidden></div>
            <div id="crosshair-v" class="crosshair" hidden></div>
            <div id="hits"></div>
            <div id="marker" hidden></div>
        </div>
    </div>
    <script>
        // fit-start
        const MIN_QUERY = 3;

        function fitScale(viewWidth, viewHeight, imageWidth, imageHeight) {
            return Math.max(1, viewWidth / imageWidth, viewHeight / imageHeight);
        }

        function viewport(viewWidth, viewHeight, imageWidth, imageHeight, x, y, scale) {
            return {
                left: Math.min(
                    Math.max(0, imageWidth * scale - viewWidth),
                    Math.max(0, x * scale - viewWidth / 2),
                ),
                top: Math.min(
                    Math.max(0, imageHeight * scale - viewHeight),
                    Math.max(0, y * scale - viewHeight / 2),
                ),
            };
        }

        // the white hole inside one of Quow's room rings is the 6x6 map-pixel
        // box at x-2..x+3, y-2..y+3, so the room's true centre is (x+1, y+1)
        function roomBox(x, y, scale) {
            return {
                left: (x - 2) * scale,
                top: (y - 2) * scale,
                size: 6 * scale,
            };
        }

        // Quow's own zoom levels
        const ZOOMS = [0.5, 0.75, 1, 1.5, 2, 3, 4];

        function stepZoom(scale, direction) {
            const options = direction > 0
                ? ZOOMS.filter(zoom => zoom > scale)
                : ZOOMS.filter(zoom => zoom < scale).reverse();
            return options[0] ?? scale;
        }

        // scroll offset that keeps the map point under (pointerX, pointerY) still
        function zoomAt(scrollLeft, scrollTop, pointerX, pointerY, from, to) {
            return {
                left: (scrollLeft + pointerX) / from * to - pointerX,
                top: (scrollTop + pointerY) / from * to - pointerY,
            };
        }

        function debounce(work, delay) {
            let timer = null;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => work(...args), delay);
            };
        }

        function matches(rooms, query) {
            const wanted = query.trim().toLowerCase();
            if (wanted.length < MIN_QUERY) return [];

            const points = new Map();
            for (const room of rooms) {
                const haystack = [room.name, ...(room.tags ?? [])].join(" ").toLowerCase();
                if (!haystack.includes(wanted)) continue;
                const key = `${room.x},${room.y}`;
                const point = points.get(key) ?? {x: room.x, y: room.y, rooms: []};
                point.rooms.push(room);
                points.set(key, point);
            }
            return [...points.values()];
        }

        function pointLabel(point) {
            const [first, ...rest] = point.rooms;
            const tags = first.tags?.length ? ` — ${first.tags.join(", ")}` : "";
            const more = rest.length ? ` (+${rest.length})` : "";
            return `${first.name}${tags}${more}`;
        }
        // fit-end

        const where = document.querySelector("#where");
        const view = document.querySelector("#view");
        const world = document.querySelector("#world");
        const image = document.querySelector("#map");
        const marker = document.querySelector("#marker");
        const crosshairH = document.querySelector("#crosshair-h");
        const crosshairV = document.querySelector("#crosshair-v");
        const search = document.querySelector("#search");
        const count = document.querySelector("#count");
        const hits = document.querySelector("#hits");
        let current = null;
        let userScale = null;
        let rooms = [];
        let found = [];

        function draw(recentre) {
            if (!current) return;

            const scale = userScale ?? fitScale(
                view.clientWidth,
                view.clientHeight,
                current.w,
                current.h,
            );
            world.style.width = `${current.w * scale}px`;
            world.style.height = `${current.h * scale}px`;
            image.style.width = `${current.w * scale}px`;
            image.style.height = `${current.h * scale}px`;
            const box = roomBox(current.x, current.y, scale);
            marker.style.left = `${box.left}px`;
            marker.style.top = `${box.top}px`;
            marker.style.width = `${box.size}px`;
            marker.style.height = `${box.size}px`;
            crosshairH.style.top = `${(current.y + 1) * scale}px`;
            crosshairV.style.left = `${(current.x + 1) * scale}px`;
            marker.hidden = false;
            crosshairH.hidden = false;
            crosshairV.hidden = false;
            placeHits(scale);

            if (recentre) {
                const offset = viewport(
                    view.clientWidth,
                    view.clientHeight,
                    current.w,
                    current.h,
                    current.x,
                    current.y,
                    scale,
                );
                view.scrollLeft = offset.left;
                view.scrollTop = offset.top;
            }
        }

        function placeHits(scale) {
            hits.replaceChildren(...found.map(point => {
                const dot = document.createElement("div");
                dot.className = "hit";
                dot.style.left = `${point.x * scale}px`;
                dot.style.top = `${point.y * scale}px`;
                const label = document.createElement("span");
                label.textContent = pointLabel(point);
                dot.append(label);
                return dot;
            }));
        }

        function runSearch() {
            found = matches(rooms, search.value);
            const total = found.reduce((sum, point) => sum + point.rooms.length, 0);
            const asked = search.value.trim().length >= MIN_QUERY;
            count.textContent = asked ? `${total} rooms` : "";
            draw(false);
        }

        async function loadRooms(mapId) {
            rooms = [];
            try {
                const response = await fetch(`/rooms?map=${mapId}`);
                if (!response.ok) throw new Error(response.status);
                rooms = (await response.json()).rooms;
            } catch (error) {
                console.debug("could not load rooms", error);
            }
            runSearch();
        }

        function update(data) {
            if (!data.known) {
                where.textContent = current
                    ? `${current.title} — unknown room (${data.room})`
                    : `Unknown room (${data.room})`;
                return;
            }

            const changedMap = !current || current.map !== data.map;
            const changedImage = !current || current.image !== data.image;
            current = data;
            where.textContent = `${data.title} — ${data.room}`;
            if (changedMap) loadRooms(data.map);
            document.body.style.background = data.bg;
            if (changedImage) {
                image.onload = () => draw(true);
                image.src = `/maps/${encodeURIComponent(data.image)}`;
            } else {
                draw(true);
            }
        }

        view.addEventListener("wheel", event => {
            if (!current) return;
            event.preventDefault();
            const automatic = fitScale(
                view.clientWidth,
                view.clientHeight,
                current.w,
                current.h,
            );
            const scale = userScale ?? automatic;
            const next = stepZoom(scale, event.deltaY < 0 ? 1 : -1);
            if (next === scale) return;
            const bounds = view.getBoundingClientRect();
            const offset = zoomAt(
                view.scrollLeft,
                view.scrollTop,
                event.clientX - bounds.left,
                event.clientY - bounds.top,
                scale,
                next,
            );
            userScale = next;
            draw(false);
            view.scrollLeft = offset.left;
            view.scrollTop = offset.top;
        }, {passive: false});

        let pan = null;

        view.addEventListener("pointerdown", event => {
            if (event.button !== 0) return;
            pan = {
                x: event.clientX,
                y: event.clientY,
                left: view.scrollLeft,
                top: view.scrollTop,
            };
            view.setPointerCapture(event.pointerId);
            view.classList.add("panning");
            event.preventDefault();
        });

        view.addEventListener("pointermove", event => {
            if (!pan) return;
            view.scrollLeft = pan.left - (event.clientX - pan.x);
            view.scrollTop = pan.top - (event.clientY - pan.y);
        });

        const endPan = event => {
            if (!pan) return;
            pan = null;
            view.releasePointerCapture(event.pointerId);
            view.classList.remove("panning");
        };

        view.addEventListener("pointerup", endPan);
        view.addEventListener("pointercancel", endPan);

        search.addEventListener("input", debounce(runSearch, 150));
        window.addEventListener("resize", () => draw(true));
        const events = new EventSource("/events");
        events.onmessage = event => update(JSON.parse(event.data));
    </script>
</body>
</html>
